<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resolvedor de colas · OptiQueue</title>
    <meta name="description" content="Resuelve cualquier ejercicio de teoría de colas: M/M/1, M/M/c, M/M/1/K, M/M/c/K, población finita, M/G/1, M/D/1, M/Ek/1 y M/M/∞, con desarrollo paso a paso, distribución Pn, costos y optimización de servidores." />
    <meta name="theme-color" content="#0f1b2d" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Tema: preferencia guardada o la del sistema (antes de pintar, sin parpadeo)
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      })();
      document.documentElement.classList.add('splash-lock');
      window.__splashStart = performance.now();
      // Respaldo: si algo falla al cargar, la pantalla de carga no se queda fija.
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('is-done'); document.documentElement.classList.remove('splash-lock'); }
      }, 8000);
    </script>
    <style>
      .splash-lock, .splash-lock body { overflow: hidden; }
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: #fff;
        background: radial-gradient(60% 50% at 50% 45%, #15295e 0%, #0e1a3a 60%, #0a1228 100%);
        font-family: 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; transition: opacity .45s ease, visibility .45s; }
      #splash.is-done { opacity: 0; visibility: hidden; }
      #splash .sp-box { display: flex; flex-direction: column; align-items: center; gap: 1.15rem; padding: 0 1.5rem; text-align: center; }
      #splash .sp-logo { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 18px 40px -14px rgba(37, 99, 235, .7); animation: sp-in .6s cubic-bezier(.34, 1.56, .64, 1) both; }
      #splash .sp-ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw .8s cubic-bezier(.65, 0, .35, 1) .15s forwards; }
      #splash .sp-tail { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw .3s ease-out .85s forwards; }
      #splash .sp-dot { opacity: 0; animation: sp-queue 1.5s ease-in-out infinite; }
      #splash .sp-d1 { animation-delay: .9s; } #splash .sp-d2 { animation-delay: 1.05s; } #splash .sp-d3 { animation-delay: 1.2s; }
      #splash .sp-served { transform-origin: 52.5px 52.5px; transform: scale(0); animation: sp-pop 1.5s ease-in-out 1.1s infinite; }
      #splash .sp-name { font-size: 1.4rem; font-weight: 650; letter-spacing: .01em; }
      #splash .sp-name span { color: #8fb0ff; }
      #splash .sp-sub { margin-top: .25rem; font-size: .85rem; color: #94a3b8; }
      #splash .sp-track { width: 11rem; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
      #splash .sp-track span { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8fb0ff, #5eead4); animation: sp-load 1.2s ease-in-out infinite; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-queue { 0% { opacity: 0; transform: translateX(-4px); } 30%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(4px); } }
      @keyframes sp-pop { 0%, 100% { transform: scale(.6); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
      @keyframes sp-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(275%); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none; } #splash .sp-ring, #splash .sp-tail { stroke-dashoffset: 0; } #splash .sp-dot, #splash .sp-served { opacity: 1; transform: none; } }
    </style>
    <noscript><style>#splash { display: none !important; } .splash-lock, .splash-lock body { overflow: auto; }</style></noscript>
  </head>
  <body class="rv-body">
    <div id="splash" role="status" aria-live="polite">
      <div class="sp-box">
        <svg class="sp-logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b63f0"/><stop offset="1" stop-color="#1a3aa8"/></linearGradient></defs>
          <rect width="64" height="64" rx="15" fill="url(#spbg)"/>
          <circle class="sp-ring" cx="29" cy="29" r="15.5" pathLength="1" fill="none" stroke="#fff" stroke-width="5.5" transform="rotate(-90 29 29)"/>
          <path class="sp-tail" d="M37 37 47 47" pathLength="1" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
          <circle class="sp-dot sp-d1" cx="21.5" cy="27.5" r="2.7" fill="#fff"/>
          <circle class="sp-dot sp-d2" cx="28.5" cy="27.5" r="2.7" fill="#fff"/>
          <circle class="sp-dot sp-d3" cx="35.5" cy="27.5" r="2.7" fill="#fff"/>
          <circle class="sp-served" cx="52.5" cy="52.5" r="3.6" fill="#5eead4"/>
        </svg>
        <div>
          <div class="sp-name">Opti<span>Queue</span></div>
          <div class="sp-sub">Preparando el resolvedor de colas…</div>
        </div>
        <div class="sp-track" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <a href="#resolver" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[60] focus:bg-surface focus:px-3 focus:py-2 focus:rounded-md focus:border focus:border-line">Saltar al resolvedor</a>

    <header class="rv-top">
      <div class="max-w-6xl mx-auto h-16 px-4 sm:px-8 flex items-center gap-3">
        <a href="/" class="flex items-center gap-2.5 shrink-0" title="Ir al panel">
          <img src="/favicon.svg" alt="" width="30" height="30" class="nav-logo rounded-[8px]" />
          <span class="font-semibold text-ink tracking-tight">Opti<span class="text-accent">Queue</span></span>
        </a>
        <span class="hidden sm:block h-5 w-px bg-line" aria-hidden="true"></span>
        <nav aria-label="Ruta" class="hidden sm:flex min-w-0 items-center gap-2 text-sm">
          <a href="/" class="text-slate-500 hover:text-ink">Panel</a>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300"></i>
          <span class="font-medium text-ink truncate">Resolvedor de colas</span>
        </nav>
        <div class="ml-auto flex items-center gap-2">
          <a href="/" class="btn"><i data-lucide="arrow-left"></i><span class="hidden sm:inline">Panel del caso</span></a>
          <button id="themeToggle" type="button" class="btn w-9 px-0" aria-label="Activar modo oscuro" title="Cambiar tema"><i data-lucide="moon"></i></button>
        </div>
      </div>
    </header>

    <main id="resolver" class="max-w-6xl mx-auto px-4 sm:px-8 pb-16"></main>

    <footer id="pie" class="border-t border-line bg-surface"></footer>

    <script type="module" src="/src/resolver.js"></script>
  </body>
</html>
