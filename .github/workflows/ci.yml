name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web (tests y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  python:
    name: Python (modelo, simulación y gráfico)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      - name: Modelo con PuLP (debe dar x* = 15)
        run: |
          python modelo.py | tee salida.txt
          grep -q "Optimal" salida.txt
          grep -q "x\* = 15" salida.txt
      - run: python simulacion.py
      - run: MPLBACKEND=Agg python grafico.py
